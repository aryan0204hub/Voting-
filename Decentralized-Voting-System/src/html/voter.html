<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voter Portal - Voting DApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/voter.css">
</head>
<body class="bg-dark">

  <div class="container my-5">
    <h2 class="text-white text-center mb-4">🔒 Verify Your Identity Before Voting</h2>
    <form id="voterForm" class="row g-3 justify-content-center">
      <div class="col-md-4">
        <input type="text" class="form-control" id="voterName" placeholder="Enter your Name" required>
      </div>
      <div class="col-md-2">
        <input type="number" class="form-control" id="voterAge" placeholder="Enter your Age" required>
      </div>
      <div class="col-md-3">
        <input type="text" class="form-control" id="voterGender" placeholder="Enter your Gender" required>
      </div>
    </form>

    <!-- Live status message -->
    <p id="formStatus" class="text-info text-center mt-3"></p>
  </div>

  <div class="container text-center my-5">
    <h1 class="text-white mb-4">🗳️ Welcome to Voting Portal</h1>

    <div id="phaseInfo" class="mb-4 text-white fs-5"></div>

    <div id="candidatesContainer" class="d-flex flex-wrap justify-content-center gap-4">
      <!-- Candidates will be dynamically loaded here -->
    </div>
  </div>

  <!-- Spinner (hidden by default) -->
  <div id="loadingSpinner" class="d-none text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <div class="text-white mt-2">⏳ Processing Transaction...</div>
  </div>
 

  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script src="../js/vote.js"></script>

  <!-- Live validation script -->
  <script>
    function validateVoterForm() {
      const name = document.getElementById('voterName').value.trim();
      const age = document.getElementById('voterAge').value.trim();
      const gender = document.getElementById('voterGender').value.trim();
      const voteButtons = document.querySelectorAll('.vote-button');

      if (name && age && gender) {
        voteButtons.forEach(btn => btn.disabled = false);
        document.getElementById('formStatus').innerText = "✅ Details ready. Now select a candidate!";
      } else {
        voteButtons.forEach(btn => btn.disabled = true);
        document.getElementById('formStatus').innerText = "⚠️ Please complete all fields.";
      }
    }

    document.getElementById('voterForm').addEventListener('input', validateVoterForm);
  </script>

</body>
</html>
