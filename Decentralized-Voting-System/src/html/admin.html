<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel - Voting DApp</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Poppins font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <!-- Your custom CSS -->
  <link href="../css/admin.css" rel="stylesheet" />

  <!-- html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 text-white">🛡️ Election Admin Panel</span>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5">

    <h2 class="text-center">🔐 Admin Dashboard</h2>

    <!-- Add Candidate Card -->
    <div class="card">
      <h4>Add Candidate</h4>
      <input type="text" id="candidateName" class="form-control mb-2" placeholder="Candidate Name" />
      <input type="text" id="candidateParty" class="form-control mb-2" placeholder="Party Name" />
      <button class="btn btn-primary" onclick="addCandidate()">Add Candidate</button>
    </div>

    <!-- Register Voter Card -->
    <div class="card">
      <h4>Register Voter</h4>
      <input type="text" id="voterAddress" class="form-control mb-2" placeholder="Voter Address (0x...)" />
      <input type="text" id="voterName" class="form-control mb-2" placeholder="Voter Name" />
      <input type="number" id="voterAge" class="form-control mb-2" placeholder="Voter Age" />
      <input type="text" id="voterGender" class="form-control mb-2" placeholder="Voter Gender" />
      <button class="btn btn-success" onclick="registerVoter()">Register Voter</button>
      <div id="voterSuccess" class="alert alert-success mt-3 d-none"></div>
    </div>

    <!-- Election Controls Card -->
    <div class="card">
      <h4>Election Controls</h4>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-warning" onclick="startElection()">Start Election</button>
        <button class="btn btn-danger" onclick="endElection()">End Election</button>
      </div>
    </div>

    <!-- Current Election Phase -->
    <div class="alert alert-info text-center">
      <strong>Current Election Phase:</strong> <span id="electionPhase">Loading...</span>
    </div>

    <!-- Registered Voters -->
    <div class="card">
      <h4>🗳️ Registered Voters:</h4>
      <div id="registeredVotersList"></div>
    </div>

    <!-- Voter Slip -->
    <div id="voterSlip" class="mt-4"></div>

    <!-- Countdown -->
    <div class="alert alert-warning text-center mt-4" id="countdown">
      Countdown loading...
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script src="../js/admin.js"></script> <!-- Your logic script -->
</body>
</html>
