<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decentralized Voting DApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css">
</head>
<body class="bg-dark text-white d-flex flex-column justify-content-center align-items-center vh-100">

  <h1 class="mb-5">🗳️ Welcome to Decentralized Voting</h1>

  <div class="d-grid gap-4 col-6 mx-auto">
    <button class="btn btn-outline-light btn-lg" onclick="location.href='voter.html'">🧑‍💼 Voter Portal</button>
    <button class="btn btn-outline-success btn-lg" onclick="location.href='admin.html'">🔐 Admin Panel</button>
    <button class="btn btn-outline-warning btn-lg" onclick="location.href='results.html'">📊 View Results</button>
  </div>

  <p class="mt-5 small">Ensure your MetaMask wallet is connected!</p>

  <script>
    window.addEventListener('load', async () => {
      if (window.ethereum) {
        try {
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          console.log("Wallet connected:", accounts[0]);
        } catch (err) {
          console.error("User rejected connection");
        }
      }
    });
  </script>
</body>
</html>
